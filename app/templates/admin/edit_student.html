<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Student | Online Quiz Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            max-width: 700px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 8px;
            color: #2563eb;
        }

        .subtitle {
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .help {
            display: block;
            margin-top: 7px;
            color: #64748b;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }

        .blue {
            background: #2563eb;
            color: white;
        }

        .gray {
            background: #64748b;
            color: white;
        }

        .alert {
            padding: 13px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
        }

        @media(max-width:600px) {

            .container {
                margin: 20px auto;
            }

            .card {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <div class="icon">
                ✏️
            </div>

            <h1>
                Edit Student
            </h1>

            <p class="subtitle">
                Update student account information.
            </p>

        </div>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for(
                'admin.edit_student',
                user_id=student.id
            ) }}"
        >

            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ student.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ student.email }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Leave blank to keep current password"
                    minlength="6"
                >

                <span class="help">
                    Leave blank if you do not want to change the password.
                </span>

            </div>


            <div class="buttons">

                <a
                    href="{{ url_for('admin.students') }}"
                    class="btn gray"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn blue"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
