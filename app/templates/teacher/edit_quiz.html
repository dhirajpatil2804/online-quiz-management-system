<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .navbar {
            background: linear-gradient(
                90deg,
                #2563eb,
                #1d4ed8
            );

            color: white;
            padding: 14px 24px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
            font-size: 21px;
        }

        .nav-buttons a {
            text-decoration: none;
            color: white;
            padding: 9px 15px;
            border-radius: 6px;
            margin-left: 8px;
            font-weight: 600;
        }

        .dashboard-btn {
            background: #1e40af;
        }

        .logout-btn {
            background: #dc2626;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 7px;

            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn {
            background: #2563eb;
            color: white;
            flex: 1;
        }

        .back-btn {
            background: #64748b;
            color: white;
        }

        @media (max-width: 650px) {

            .row {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>
            Online Quiz Management System
        </h2>

        <div class="nav-buttons">

            <a
                href="{{ url_for('teacher.dashboard') }}"
                class="dashboard-btn"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('auth.logout') }}"
                class="logout-btn"
            >
                Logout
            </a>

        </div>

    </div>


    <div class="container">

        <div class="form-card">

            <h1>
                Edit Quiz
            </h1>

            <form
                method="POST"
                action="{{ url_for(
                    'teacher.edit_quiz',
                    quiz_id=quiz.id
                ) }}"
            >

                <div class="form-group">

                    <label for="title">
                        Quiz Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ quiz.title }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                    >{{ quiz.description or "" }}</textarea>

                </div>


                <div class="row">

                    <div class="form-group">

                        <label for="duration">
                            Duration (minutes)
                        </label>

                        <input
                            type="number"
                            id="duration"
                            name="duration"
                            value="{{ quiz.duration }}"
                            min="1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="total_marks">
                            Total Marks
                        </label>

                        <input
                            type="number"
                            id="total_marks"
                            name="total_marks"
                            value="{{ quiz.total_marks }}"
                            min="1"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="passing_marks">
                        Passing Marks
                    </label>

                    <input
                        type="number"
                        id="passing_marks"
                        name="passing_marks"
                        value="{{ quiz.passing_marks }}"
                        min="0"
                        required
                    >

                </div>


                <div class="buttons">

                    <a
                        href="{{ url_for('teacher.quizzes') }}"
                        class="btn back-btn"
                    >
                        ← Back
                    </a>

                    <button
                        type="submit"
                        class="btn save-btn"
                    >
                        Update Quiz
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
