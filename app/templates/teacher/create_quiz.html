<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Quiz - Online Quiz Management System
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .navbar {
            background: #2563eb;
            color: white;

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;

            padding: 9px 15px;

            border-radius: 6px;
        }

        .back-btn {
            background: #1d4ed8;
        }

        .logout {
            background: #dc2626;
        }

        .container {
            max-width: 750px;

            margin: 40px auto;

            padding: 0 20px;
        }

        .form-card {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-card h1 {
            color: #1e293b;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-weight: bold;
        }

        .required {
            color: #dc2626;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        textarea {
            min-height: 120px;

            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .help-text {
            display: block;

            margin-top: 6px;

            color: #64748b;

            font-size: 13px;
        }

        .row {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }

        .message {
            padding: 12px 15px;

            margin-bottom: 20px;

            border-radius: 7px;

            background: #fee2e2;

            color: #991b1b;
        }

        .buttons {
            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        .btn {
            border: none;

            padding: 12px 22px;

            border-radius: 7px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;
        }

        .save-btn {
            background: #16a34a;

            color: white;
        }

        .cancel-btn {
            background: #e2e8f0;

            color: #334155;
        }

        .save-btn:hover {
            background: #15803d;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

        @media (max-width: 650px) {

            .row {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 25px;
            }

            .form-card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <div class="navbar">

        <h2>
            Online Quiz Management System
        </h2>

        <div class="nav-links">

            <a
                href="{{ url_for('teacher.dashboard') }}"
                class="back-btn"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('auth.logout') }}"
                class="logout"
            >
                Logout
            </a>

        </div>

    </div>


    <div class="container">

        <div class="form-card">

            <h1>
                Create New Quiz
            </h1>

            <p class="subtitle">
                Enter the basic information for your quiz.
            </p>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">


                <div class="form-group">

                    <label for="title">

                        Quiz Title

                        <span class="required">
                            *
                        </span>

                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Example: Python Fundamentals"
                        maxlength="200"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter a short description about this quiz..."
                    ></textarea>

                </div>


                <div class="row">


                    <div class="form-group">

                        <label for="duration">

                            Duration (Minutes)

                            <span class="required">
                                *
                            </span>

                        </label>

                        <input
                            type="number"
                            id="duration"
                            name="duration"
                            min="1"
                            placeholder="30"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="total_marks">

                            Total Marks

                            <span class="required">
                                *
                            </span>

                        </label>

                        <input
                            type="number"
                            id="total_marks"
                            name="total_marks"
                            min="1"
                            placeholder="20"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="passing_marks">

                            Passing Marks

                            <span class="required">
                                *
                            </span>

                        </label>

                        <input
                            type="number"
                            id="passing_marks"
                            name="passing_marks"
                            min="0"
                            placeholder="8"
                            required
                        >

                    </div>


                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="btn save-btn"
                    >
                        Create Quiz
                    </button>

                    <a
                        href="{{ url_for('teacher.dashboard') }}"
                        class="btn cancel-btn"
                    >
                        Cancel
                    </a>

                </div>


            </form>

        </div>

    </div>


</body>

</html>
