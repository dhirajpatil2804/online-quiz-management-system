
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Quiz Management</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            color: #172033;
        }
        .container {
            max-width: 520px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 28px #17255412;
        }
        h1 { margin-top: 0; }
        p { color: #64748b; }
        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }
        button, .back {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: #356df3;
            color: white;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .back { background: #64748b; margin-left: 8px; }
        .message { padding: 10px; border-radius: 8px; background: #eff6ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Add Student</h1>
        <p>Create a student login account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="name">Student Name</label>
            <input id="name" type="text" name="name"
                   maxlength="100" required>

            <label for="email">Email Address</label>
            <input id="email" type="email" name="email"
                   maxlength="120" required>

            <label for="password">Temporary Password</label>
            <input id="password" type="password" name="password"
                   minlength="8" required>

            <button type="submit">Create Student</button>
            <a class="back" href="{{ url_for('teacher.dashboard') }}">Back</a>
        </form>
    </div>
</body>
</html>
